[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hangoutduck"
version = "0.1.0"
description = "HangoutDuck 真机软件：飞特 1910 总线舵机驱动、IMU、树莓派 50 Hz 运行时与调试工具"
readme = "README.md"
# 树莓派 OS Bookworm（64 位）自带 Python 3.11
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "pyserial>=3.4",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
policy = ["onnxruntime"]

[project.scripts]
hduck = "hangoutduck.cli:main"

[tool.setuptools.packages.find]
include = ["hangoutduck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
